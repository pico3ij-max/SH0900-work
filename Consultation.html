    <section class="consultation">
        <form action="" autocomplete="off">
            <label for="input">نام کامل شما<span style="color: red;">*</span> :</label>

            <div class="about-user">
                <input type="text" id="user-name" name="username" placeholder="نام">
                <input type="text" id="user-lastname" name="userlastname" placeholder="نام خانوادگی">
            </div>

            <label for="input">شماره تلفن<span style="color: red;">*</span> :</label>

            <div>
                <input type="number" id="user-phone" name="phonenumber" placeholder="شماره تلفن">
            </div>

            <label for="input">موضوع مشاوره<span style="color: red;">*</span> :</label>

            <div>
                <select name="subject-consultation" id="subject-consultation">

                    <optgroup label="دعاوی ها">
                        <option value="بیمه عمر و حوادث">بیمه عمر و حوادث</option>
                        <option value="اختلافات بیمه شخص ثالث">اختلافات بیمه شخص ثالث</option>
                        <option value="تصادفات و خسارت خودرو">تصادفات و خسارت خودرو</option>
                        <option value="مطالبه خسارت بیمه">مطالبه خسارت بیمه</option>
                    </optgroup>

                </select>
            </div>

            <label for="input">شرح مختصر موضوع<span style="color: red;">*</span> :</label>

            <textarea name="user-credential" id="user-credential" placeholder="موضوع و نکات ضروری را به اختصار شرح دهید." ></textarea>

            <label class="container">
با ثبت و ارسال این فرم تأیید می‌کنم که تقاضای مشاوره حقوقی دارم و آگاه هستم که دریافت مشاوره حقوقی مستلزم پرداخت حق‌المشاوره‌ای است که اعلام شده.
                <input type="checkbox" id="rls">
                <span class="checkmark"></span>
            </label>

            <div>
                <input type="submit" id="send" value="ثبت و ارسال">
            </div>
        </form>
    </section>
